#version: "3.9"

services:
  app:
    build: .
    container_name: mi-app-node
    working_dir: /home/app
    ports:
      - "4000:4000"
    restart: unless-stopped
    volumes:
      - .:/home/app
      - ./img:/usr/src/app/public/img
      - /home/app/node_modules  #agregado
    env_file:
      - .env
    environment:
      NODE_ENV: production

    #command: node app.js

  ngrok:
    image: ngrok/ngrok:latest
    container_name: mi-ngrok
    depends_on:
    - app
    ports:
    - "4040:4040"
    restart: unless-stopped
    env_file:
    - .env
    command: http app:4000
    profiles: ["ngrok"]

  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: mi-cloudflared
    depends_on:
      - app
    command: tunnel --no-autoupdate run #skill_JM #--url http://app:4000
    volumes:
    - ${PWD}/cloudflared:/etc/cloudflared  #./cloudflared:/etc/cloudflared
    profiles: ["cloudflare"]

    #docker-compose --profile ngrok up

    #docker-compose --profile cloudflare up

    #en .gitignore agregar: .cloudflared/ , por eso la carpeta cloudflared la tengo q crear afuera del proyecto, para que no se suba a github, 
    #y dentro de esa carpeta colocar el archivo de configuracion del tunnel, el cual se obtiene al crear el tunnel en cloudflare, y ese archivo se llama: skill_JM.json o la ....json
    # .json y el config.yml. El cert.pem es necesario si uso cloudlfared login, pero si ya tengo el .json con las credenciales del tunnel, no es necesario el cert.pem, por eso no lo subo a github, 
    # y el config.yml es para configurar opciones adicionales del tunnel, como el nombre del tunnel, la url a la que se va a conectar, etc.